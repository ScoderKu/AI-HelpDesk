name: ai-helpdesk

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.hmr
    ports:
      - "127.0.0.1:8088:5173"
    volumes:
    - ./frontend:/app
    - /app/node_modules
    environment:
    - CHOKIDAR_USEPOLLING=true
    - API_PROXY_TARGET=http://backend-proxy:8000
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    depends_on:
    - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./knowledge:/knowledge:ro
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-poro-helpdesk}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://127.0.0.1:5173}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      REDIS_URL: "redis://redis:6379/0"
      KNOWLEDGE_BASE_DIR: "/knowledge"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-172.30.0.2/32}"
    networks:
      default: {}
      proxy:
        ipv4_address: 172.30.0.3
        aliases:
          - backend-proxy
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-model-init:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-poro-helpdesk}"
      OLLAMA_MODEL_SOURCE: "${OLLAMA_MODEL_SOURCE:-modelfile}"
    volumes:
      - ./ollama:/models:ro
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - >-
        set -e;
        rm -f /tmp/model-ready;
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        if ! ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          case "$$OLLAMA_MODEL_SOURCE" in
            modelfile) ollama create "$$OLLAMA_MODEL" -f /models/Modelfile ;;
            registry) ollama pull "$$OLLAMA_MODEL" ;;
            *) echo "Unsupported OLLAMA_MODEL_SOURCE: $$OLLAMA_MODEL_SOURCE" >&2; exit 1 ;;
          esac;
        fi;
        touch /tmp/model-ready;
        while :; do sleep 3600; done
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/model-ready"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  ollama_data:

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
